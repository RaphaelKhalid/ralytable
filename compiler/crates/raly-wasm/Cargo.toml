[package]
name = "raly-wasm"
description = "WebAssembly bindings for the Raly front end, used by the browser playground."
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# Deliberately its own workspace: this crate only ever builds for
# wasm32-unknown-unknown, so it is excluded from the compiler workspace and
# stays out of `cargo build/test/clippy --workspace`.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
raly = { path = "../raly" }
raly-ast = { path = "../raly-ast" }
raly-diag = { path = "../raly-diag" }
raly-lexer = { path = "../raly-lexer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "=0.2.100"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
